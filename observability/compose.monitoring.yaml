# ---------------------------------------------------------------------------
# Ionowu — stack pemantauan `ionowu-monitoring`
#
# Menutup OBS-05: sebelum ini tidak ada satu pun yang memberi tahu kalau situs
# mati, dan supaya trace bisa ditelusuri saat ada yang lambat.
#
# Kepatuhan: IMG-02 (digest terkunci), RUN-01 (nonroot), RUN-05 (batas sumber
# daya), RUN-16 (log driver local), ISO-06 (tidak ada satu pun layanan di
# sini yang punya route publik).
#
# Catatan ISO-06: Jaeger BERGABUNG ke dokploy-network, tetapi tidak punya
# label Traefik. Ia perlu satu jaringan dengan aplikasi supaya bisa MENERIMA
# trace -- itu tidak sama dengan terekspos ke internet. Layanan lain di stack
# ini tetap terkurung di jaringan `ionowu-monitoring` saja.
#
# Akses UI: TIDAK diekspos ke internet. Port hanya diikat ke 127.0.0.1, jadi
# dijangkau lewat SSH tunnel:
#   ssh -N -L 9090:127.0.0.1:9090 -L 9093:127.0.0.1:9093 \
#          -L 16686:127.0.0.1:16686 root@76.13.16.85
# lalu buka http://localhost:9090 (Prometheus), :9093 (Alertmanager),
# atau :16686 (Jaeger, penelusuran trace)
#
# RAHASIA: bot token Telegram TIDAK ada di repo. Ia dibaca dari berkas
# ./secrets/telegram-bot-token di server, yang dibuat pemiliknya sendiri.
# ---------------------------------------------------------------------------

name: ionowu-monitoring

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: ionowu-prometheus
    # UID 65534 (nobody) — sama dengan pemilik /prometheus di dalam image,
    # sehingga volume data ikut terbentuk dengan kepemilikan yang benar.
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/conf/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retensi ganda: waktu DAN ukuran. Batas ukuran yang menjaga disk host
      # tidak habis diam-diam kalau target bertambah banyak.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=4GB
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle
    volumes:
      # Yang di-mount DIREKTORI, bukan berkas satuan. Bind mount berkas tunggal
      # terikat ke inode: begitu berkasnya diganti (rsync, tar, editor yang
      # menulis lewat berkas sementara), kontainer tetap membaca isi yang lama
      # dan `/-/reload` seolah berhasil padahal tidak mengubah apa pun.
      - ./:/etc/prometheus/conf:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      # Diikat ke loopback saja — tidak terjangkau dari internet.
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

  blackbox:
    <<: *defaults
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: ionowu-blackbox
    user: "65534:65534"
    command:
      - --config.file=/etc/blackbox/conf/blackbox.yml
    volumes:
      # Direktori, bukan berkas satuan — alasannya sama seperti di Prometheus.
      - ./:/etc/blackbox/conf:ro
    # Tidak ada `ports:` — hanya Prometheus yang perlu menjangkaunya, lewat
    # jaringan internal stack ini.
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

  # --- Alertmanager: yang benar-benar mengirim kabar ------------------------
  # Prometheus hanya MENENTUKAN kapan alert menyala; tanpa layanan ini, alert
  # berhenti sebagai warna di UI dan tidak ada manusia yang diberi tahu.
  alertmanager:
    <<: *defaults
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    container_name: ionowu-alertmanager
    user: "65534:65534"
    command:
      # Membaca berkas HASIL RENDER di secrets/, bukan templat di repo.
      # Templatnya tidak memuat chat id, dan direktori secrets/ tidak pernah
      # ikut tersalin saat konfigurasi disinkronkan ulang dari repo — jadi
      # chat id dan token tidak bisa tertimpa diam-diam oleh deploy berikutnya.
      - --config.file=/etc/alertmanager/conf/secrets/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      # Direktori, bukan berkas satuan — alasannya sama seperti di Prometheus.
      - ./:/etc/alertmanager/conf:ro
      # Menyimpan silence dan catatan notifikasi. Kalau volume ini hilang,
      # alert yang sudah dibisukan akan berteriak lagi setelah restart.
      - alertmanager-data:/alertmanager
    tmpfs:
      - /tmp:size=32m,mode=1777
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

  # --- cAdvisor: metrik per kontainer ---------------------------------------
  # Menghidupkan dua aturan yang tanpa ini tidak punya data sama sekali:
  # IonowuWebSeringRestart dan IonowuWebMendekatiBatasMemori.
  #
  # PERHATIAN — layanan ini sengaja TIDAK memakai anchor `*defaults`, dan itu
  # penurunan keamanan yang disadari: cAdvisor bekerja dengan membaca cgroup,
  # /sys, dan state Docker milik host, jadi `cap_drop: ALL` membuatnya buta.
  # Yang bisa dilakukan sudah dilakukan: seluruh mount host read-only, tidak
  # ada port yang dipublikasikan, hanya Prometheus di jaringan ini yang bisa
  # menjangkaunya, dan image tetap dikunci ke digest.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: ionowu-cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      # Hanya kontainer Docker yang dipantau — bukan seluruh cgroup host.
      - --docker_only=true
      - --housekeeping_interval=30s
      # Label kontainer TIDAK disimpan semuanya: label Traefik dan Dokploy
      # akan meledakkan kardinalitas metrik. Hanya dua yang benar-benar dipakai
      # untuk mengelompokkan yang diizinkan lewat.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          memory: 64M

  # --- Jaeger: penampung trace OpenTelemetry (OBS-01) -----------------------
  # Sebelum ini OTEL_EXPORTER_OTLP_ENDPOINT kosong: trace_id terbentuk di
  # setiap log, tapi span-nya tidak dikirim ke mana pun. Artinya kalau ada
  # permintaan lambat, trace_id di log tidak bisa ditukar jadi jawaban
  # "lambatnya di bagian mana" -- yang justru gunanya trace.
  #
  # Jaeger dipilih di antara Tempo dan SigNoz karena host ini cuma 2 CPU:
  # SigNoz menuntut ClickHouse, Tempo menuntut Grafana plus object storage.
  # Jaeger satu kontainer 106 MB, UI sendiri, OTLP native, CNCF graduated.
  jaeger:
    <<: *defaults
    image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    container_name: ionowu-jaeger
    # Image ini sudah nonroot bawaan (UID 10001).
    user: "10001:10001"
    command:
      - --config=file:/etc/jaeger/conf/jaeger.yaml
    # Volume Docker BARU selalu dimiliki root, dan kontainer ini nonroot
    # (UID 10001) -- persis kelas masalah yang sudah dua kali menjegal
    # Prometheus dan Alertmanager di stack ini. Kalau volume `jaeger-data`
    # pernah dibuat ulang (host baru, `docker volume rm`, dst.), jalankan
    # SEKALI sebelum `up`:
    #   docker run --rm -v ionowu-monitoring-jaegerdata:/badger alpine \
    #     chown -R 10001:10001 /badger
    volumes:
      # Direktori, bukan berkas satuan -- alasannya sama seperti di Prometheus.
      - ./:/etc/jaeger/conf:ro
      - jaeger-data:/badger
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      # UI diikat ke loopback saja, dijangkau lewat SSH tunnel.
      - "127.0.0.1:16686:16686"
    networks:
      - monitoring
      # Aplikasi hidup di dokploy-network. Jaeger MENERIMA kiriman dari sana,
      # jadi harus satu jaringan dengannya -- tidak bisa lewat HTTPS publik
      # seperti scrape Prometheus tanpa membuka Jaeger ke internet.
      # Tidak ada label Traefik, jadi tetap tidak punya route publik.
      - dokploy-network
    healthcheck:
      test:
        ["CMD", "/cmd/jaeger/jaeger-linux", "validate", "--config=file:/etc/jaeger/conf/jaeger.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

networks:
  monitoring:
    name: ionowu-monitoring
  # Jaringan bersama Dokploy, dibuat di luar stack ini. HANYA Jaeger yang
  # bergabung, dan itu pun tanpa label Traefik -- ia perlu satu jaringan
  # dengan aplikasi supaya bisa MENERIMA trace, bukan supaya bisa diakses
  # dari internet.
  dokploy-network:
    external: true

volumes:
  jaeger-data:
    name: ionowu-monitoring-jaegerdata
    labels:
      # Trace berumur 7 hari dan bisa hilang tanpa kehilangan data bisnis.
      ionowu.backup: "false"
      ionowu.app: ionowu-monitoring
  alertmanager-data:
    name: ionowu-monitoring-alertmanager
    labels:
      ionowu.backup: "false"
      ionowu.app: ionowu-monitoring
  prometheus-data:
    name: ionowu-monitoring-promdata
    labels:
      # DAT-04 — riwayat metrik berguna, tapi bukan data bisnis: kalau hilang,
      # tidak ada yang tidak bisa dipulihkan. Backup harian tidak sepadan
      # dengan ukurannya.
      ionowu.backup: "false"
      ionowu.app: ionowu-monitoring
