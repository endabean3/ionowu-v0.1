# Modul probe blackbox_exporter.
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      # Kode 200 saja belum cukup: badan balasan harus benar-benar menyatakan
      # `ready`. Ini menjaga dari kasus halaman error yang tetap membalas 200.
      fail_if_body_not_matches_regexp:
        - '"status":"ready"'
