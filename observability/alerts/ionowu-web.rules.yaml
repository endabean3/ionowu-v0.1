# OBS-05 / OBS-08 — aturan alert Prometheus untuk `ionowu-web`.
#
# Setiap alert WAJIB menunjuk runbook (OBS-08); anotasi `runbook_url` di bawah
# mengarah ke bagian yang relevan di docs/runbook.md.
#
# Alert di file ini sengaja hanya memakai metrik yang pasti ada di server:
#   - `probe_*` dari blackbox_exporter
#   - `container_*` dari cAdvisor
# Metrik dari dalam aplikasi (OTLP) ikut terkirim ke kolektor, tetapi namanya
# bergantung pada konfigurasi kolektor masing-masing lingkungan, jadi tidak
# dijadikan dasar alert di sini supaya tidak ada alert yang diam-diam tidak
# pernah menyala.
#
# Target scrape yang harus ada di Prometheus:
#   blackbox: https://ionowu.com/health/ready  (modul http_2xx)
#   cadvisor: seluruh kontainer di host
#
# Kontainer disaring lewat `name=~"ionowu-web-.*"`, BUKAN lewat label proyek
# Compose. Dokploy membubuhkan sufiks acak ke nama proyek (`ionowu-web-cfa7zz`),
# jadi menyaring dengan nilai tetap `ionowu-web` tidak pernah cocok dengan apa
# pun — alert-nya diam, dan diamnya terbaca seperti "aman".

groups:
  - name: ionowu-web
    rules:
      - alert: IonowuWebTidakSiap
        expr: probe_success{job="blackbox", instance=~".*ionowu.com/health/ready"} == 0
        for: 2m
        labels:
          severity: critical
          app: ionowu-web
        annotations:
          summary: "ionowu-web tidak lolos readiness lebih dari 2 menit"
          description: >-
            /health/ready membalas gagal. Situs publik kemungkinan besar sedang
            tidak melayani permintaan, atau database tidak bisa dihubungi.
          runbook_url: https://github.com/endabean3/ionowu-v0.1/blob/main/docs/runbook.md#ionowuwebtidaksiap

      - alert: IonowuWebLambat
        expr: probe_duration_seconds{job="blackbox", instance=~".*ionowu.com/health/ready"} > 3
        for: 10m
        labels:
          severity: warning
          app: ionowu-web
        annotations:
          summary: "Readiness ionowu-web lambat (>3 detik)"
          description: >-
            Probe masih lulus tetapi lambat. Biasanya database yang mulai
            tersendat sebelum benar-benar gagal.
          runbook_url: https://github.com/endabean3/ionowu-v0.1/blob/main/docs/runbook.md#ionowuweblambat

      - alert: IonowuWebSeringRestart
        # Kalau kontainer terus-menerus "baru saja mulai" selama 10 menit
        # penuh, satu-satunya penjelasan adalah ia berulang kali mati dan
        # dihidupkan lagi. Cara ini lebih tahan banting daripada menghitung
        # `changes()`: kontainer yang dibuat ulang muncul sebagai deret baru
        # di cAdvisor, sehingga perubahan di dalam satu deret justru terlewat.
        expr: |
          time() - max by (name) (container_start_time_seconds{name=~"ionowu-web-.*"}) < 300
        for: 10m
        labels:
          severity: critical
          app: ionowu-web
        annotations:
          summary: "Kontainer ionowu-web restart berulang"
          description: "Kontainer belum sempat hidup 5 menit selama 10 menit terakhir — kemungkinan crash loop."
          runbook_url: https://github.com/endabean3/ionowu-v0.1/blob/main/docs/runbook.md#ionowuwebseringrestart

      - alert: IonowuWebMendekatiBatasMemori
        expr: |
          container_memory_working_set_bytes{name=~"ionowu-web-.*"}
          / container_spec_memory_limit_bytes{name=~"ionowu-web-.*"} > 0.9
        for: 10m
        labels:
          severity: warning
          app: ionowu-web
        annotations:
          summary: "Pemakaian memori ionowu-web di atas 90% batas"
          description: "Kontainer mendekati batas RUN-05 dan berisiko dibunuh OOM."
          runbook_url: https://github.com/endabean3/ionowu-v0.1/blob/main/docs/runbook.md#ionowuwebmendekatibatasmemori

      - alert: IonowuWebSertifikatSegeraKedaluwarsa
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox", instance=~".*ionowu.com.*"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
          app: ionowu-web
        annotations:
          summary: "Sertifikat TLS ionowu.com kurang dari 14 hari"
          runbook_url: https://github.com/endabean3/ionowu-v0.1/blob/main/docs/runbook.md#ionowuwebsertifikatsegerakedaluwarsa
