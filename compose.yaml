# ---------------------------------------------------------------------------
# Ionowu — `ionowu-web`
#
# Kepatuhan standar server:
#   ISO-04/ISO-06  hanya kontainer yang menghadap publik yang bergabung ke
#                  `dokploy-network`; sisanya terkurung di `ionowu-web-internal`
#   ISO-08         database, user, dan kredensial khusus aplikasi
#   ISO-09         prefiks kunci dan logical database Redis khusus aplikasi
#   DAT-04         volume diberi label cakupan backup
#   DAT-05         migrasi jalan sebagai job terpisah, bukan di dalam runtime
#   RUN-05         setiap layanan punya batas CPU dan memori
#   RUN-08         probe /health/live dan /health/ready
#
# Seluruh nilai rahasia datang dari secret manager lewat `.env` yang dirender
# Dokploy — tidak ada satu pun kredensial tertulis di file ini (CFG-03).
# ---------------------------------------------------------------------------

name: ionowu-web

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    # RUN-16 — driver `local` (biner, terkompresi) lebih hemat CPU dan IOPS.
    # Pada host tunggal, IOPS adalah sumber daya bersama yang tidak tercakup
    # limit CPU/memori.
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  # --- Aplikasi web (satu-satunya yang menghadap publik) -------------------
  web:
    <<: *hardening
    # DEP-01/IMG-09 — deploy WAJIB memakai digest, bukan tag. Sintaks `:?`
    # membuat deploy gagal seketika bila digest tidak disetel: aturannya
    # ditegakkan Compose sendiri, bukan kedisiplinan operator.
    image: ${IMAGE:-ghcr.io/ionowu/ionowu-web}@${IMAGE_DIGEST:?digest wajib — ambil dari keluaran CI}
    # UID 65532 sudah dipasang di Dockerfile (RUN-01); ditegaskan lagi di sini
    # supaya salah konfigurasi di sisi orkestrator ikut ketahuan.
    user: "65532:65532"
    read_only: true
    depends_on:
      # DEP-13 — postgres dan redis tidak lagi di stack ini; keduanya di
      # proyek bersama `ionowu-data`. Yang tersisa hanya urutan ke migrasi.
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      APP_VERSION: ${IMAGE_TAG:-dev}
      DEPLOY_ENVIRONMENT: ${DEPLOY_ENVIRONMENT:-production}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      TENANT_ID: ${TENANT_ID:-}
      REDIS_URL: ${REDIS_URL}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-ionowu-web:}
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      ADMIN_EMAIL_ALLOWLIST: ${ADMIN_EMAIL_ALLOWLIST}
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Alamat pengirim. Kosong = sandbox Resend, yang hanya bisa mengirim ke
      # email pendaftar akun. Isi setelah domain terverifikasi.
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      # Tujuan notifikasi lead. Kosong = alamat kontak resmi. Diisi hanya
      # sebagai penampung sementara saat penyedia email membatasi tujuan.
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      CRON_SECRET: ${CRON_SECRET}
      # Melindungi /api/metrics yang dibaca Prometheus.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET}
      CONTACT_TRUSTED_IP_HEADER: ${CONTACT_TRUSTED_IP_HEADER:-}
      OTEL_SERVICE_NAME: ionowu-web
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    tmpfs:
      # Root filesystem read-only, jadi lokasi tulis disediakan eksplisit.
      - /tmp:size=64m,mode=1777
    volumes:
      # Cache ISR Next.js; boleh hilang tanpa kehilangan data (backup: none).
      - web-cache:/app/.next/cache
    networks:
      - data
      - dokploy-network
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "docker/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      # DEP-07 — dua replika plus start-first supaya rollout tanpa downtime.
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: start-first
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      # Router publik hanya dipasang di layanan ini (ISO-06).
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.services.ionowu-web.loadbalancer.server.port: "3000"
      traefik.http.services.ionowu-web.loadbalancer.healthcheck.path: /health/ready
      traefik.http.services.ionowu-web.loadbalancer.healthcheck.interval: "15s"

  # --- Job migrasi (DAT-05) ------------------------------------------------
  # Jalan sampai selesai lalu berhenti. Sengaja TIDAK ikut `restart` supaya
  # migrasi yang gagal berhenti sebagai kegagalan yang terlihat, bukan
  # berputar diam-diam.
  migrate:
    image: ${IMAGE:-ghcr.io/ionowu/ionowu-web}-migrate@${MIGRATE_DIGEST:?digest wajib — ambil dari keluaran CI}
    user: "65532:65532"
    read_only: true
    restart: "no"
    logging:
      driver: local                      # RUN-16
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      # Migrasi memakai role owner; runtime TIDAK boleh memakai URL ini.
      DATABASE_URL: ${DATABASE_MIGRATION_URL}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # --- Postgres & Redis: TIDAK di stack ini (DEP-13) -----------------------
  # Keduanya berjalan di proyek Dokploy `ionowu-data` sebagai cluster bersama
  # seluruh aplikasi (ADR-015). Menjalankan instans sendiri per aplikasi
  # melipatgandakan baseline 150-250 MB tanpa menambah isolasi: ISO-08 menuntut
  # database, role, dan kredensial yang TERPISAH, bukan proses yang terpisah.
  #
  # Aplikasi menjangkaunya lewat jaringan `ionowu-data`, selalu melalui
  # PgBouncer (DAT-09) — tidak pernah langsung ke Postgres.

networks:
  # ISO-04/ISO-06 — jaringan lapisan data bersama, dibuat sekali oleh proyek
  # `ionowu-data`. Stack ini hanya bergabung, tidak pernah membuatnya.
  data:
    name: ionowu-data
    external: true
  # Jaringan bersama Dokploy; dibuat di luar stack ini.
  dokploy-network:
    external: true

volumes:
  # DAT-04 — label cakupan backup dibaca oleh penjadwal backup server.
  web-cache:
    name: ionowu-web-next-cache
    labels:
      # Cache turunan — bisa dibangun ulang, tidak perlu dibackup.
      ionowu.backup: "false"
      ionowu.app: ionowu-web
