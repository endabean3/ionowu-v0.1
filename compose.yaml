# ---------------------------------------------------------------------------
# Ionowu — `ionowu-web`
#
# Kepatuhan standar server:
#   ISO-04/ISO-06  hanya kontainer yang menghadap publik yang bergabung ke
#                  `dokploy-network`; sisanya terkurung di `ionowu-web-internal`
#   ISO-08         database, user, dan kredensial khusus aplikasi
#   ISO-09         prefiks kunci dan logical database Redis khusus aplikasi
#   DAT-04         volume diberi label cakupan backup
#   DAT-05         migrasi jalan sebagai job terpisah, bukan di dalam runtime
#   RUN-05         setiap layanan punya batas CPU dan memori
#   RUN-08         probe /health/live dan /health/ready
#
# Seluruh nilai rahasia datang dari secret manager lewat `.env` yang dirender
# Dokploy — tidak ada satu pun kredensial tertulis di file ini (CFG-03).
# ---------------------------------------------------------------------------

name: ionowu-web

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # --- Aplikasi web (satu-satunya yang menghadap publik) -------------------
  web:
    <<: *hardening
    image: ${IMAGE:-ghcr.io/ionowu/ionowu-web}:${IMAGE_TAG:-latest}
    # UID 65532 sudah dipasang di Dockerfile (RUN-01); ditegaskan lagi di sini
    # supaya salah konfigurasi di sisi orkestrator ikut ketahuan.
    user: "65532:65532"
    read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      APP_VERSION: ${IMAGE_TAG:-dev}
      DEPLOY_ENVIRONMENT: ${DEPLOY_ENVIRONMENT:-production}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      TENANT_ID: ${TENANT_ID:-}
      REDIS_URL: ${REDIS_URL}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-ionowu-web:}
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      ADMIN_EMAIL_ALLOWLIST: ${ADMIN_EMAIL_ALLOWLIST}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CRON_SECRET: ${CRON_SECRET}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET}
      CONTACT_TRUSTED_IP_HEADER: ${CONTACT_TRUSTED_IP_HEADER:-}
      OTEL_SERVICE_NAME: ionowu-web
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    tmpfs:
      # Root filesystem read-only, jadi lokasi tulis disediakan eksplisit.
      - /tmp:size=64m,mode=1777
    volumes:
      # Cache ISR Next.js; boleh hilang tanpa kehilangan data (backup: none).
      - web-cache:/app/.next/cache
    networks:
      - internal
      - dokploy-network
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "docker/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      # DEP-07 — dua replika plus start-first supaya rollout tanpa downtime.
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: start-first
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      # Router publik hanya dipasang di layanan ini (ISO-06).
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.services.ionowu-web.loadbalancer.server.port: "3000"
      traefik.http.services.ionowu-web.loadbalancer.healthcheck.path: /health/ready
      traefik.http.services.ionowu-web.loadbalancer.healthcheck.interval: "15s"

  # --- Job migrasi (DAT-05) ------------------------------------------------
  # Jalan sampai selesai lalu berhenti. Sengaja TIDAK ikut `restart` supaya
  # migrasi yang gagal berhenti sebagai kegagalan yang terlihat, bukan
  # berputar diam-diam.
  migrate:
    image: ${IMAGE:-ghcr.io/ionowu/ionowu-web}-migrate:${IMAGE_TAG:-latest}
    user: "65532:65532"
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Migrasi memakai role owner; runtime TIDAK boleh memakai URL ini.
      DATABASE_URL: ${DATABASE_MIGRATION_URL}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # --- Postgres khusus aplikasi (ISO-08) -----------------------------------
  # Kalau memakai Postgres terkelola (Neon/Supabase), hapus service ini dan
  # arahkan DATABASE_URL ke sana — sisa file tidak perlu berubah.
  postgres:
    <<: *hardening
    # IMG-02 — image pihak ketiga ikut dikunci ke digest, sama seperti base
    # image di Dockerfile. Tag `17-alpine` sendiri bisa berpindah kapan saja.
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ionowu_web}
      POSTGRES_USER: ${POSTGRES_USER:-ionowu_web_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ionowu_web_owner} -d ${POSTGRES_DB:-ionowu_web}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  # --- Redis khusus aplikasi (ISO-09) --------------------------------------
  redis:
    <<: *hardening
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    user: "999:999"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --databases
      - "16"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

networks:
  # ISO-04 — jaringan privat aplikasi. `internal: true` memutus akses keluar
  # sehingga postgres dan redis benar-benar tidak bisa dijangkau dari luar.
  internal:
    name: ionowu-web-internal
    internal: true
  # Jaringan bersama Dokploy; dibuat di luar stack ini.
  dokploy-network:
    external: true

volumes:
  # DAT-04 — label cakupan backup dibaca oleh penjadwal backup server.
  postgres-data:
    name: ionowu-web-postgres-data
    labels:
      ionowu.backup: "true"
      ionowu.backup.scope: daily
      ionowu.backup.retention-days: "30"
      ionowu.app: ionowu-web
  redis-data:
    name: ionowu-web-redis-data
    labels:
      ionowu.backup: "true"
      ionowu.backup.scope: daily
      ionowu.backup.retention-days: "7"
      ionowu.app: ionowu-web
  web-cache:
    name: ionowu-web-next-cache
    labels:
      # Cache turunan — bisa dibangun ulang, tidak perlu dibackup.
      ionowu.backup: "false"
      ionowu.app: ionowu-web
